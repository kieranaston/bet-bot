name: Daily bankroll/performance report

on:
  schedule:
    # Two fixed UTC times -- unlike scan.yml this workflow does no Telegram polling, so
    # there's no reason to run it on scan.yml's twice-hourly cadence just to check a time
    # gate. 13:00 UTC = 9am ET during EDT (summer), 14:00 UTC = 9am ET during EST (winter);
    # scripts/report.py's DST-aware is_scan_time check (against config/settings.yaml
    # `reporting.time_local`) makes exactly one of these two actually send the report each
    # day, so this stays correct across DST changes.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch: {}

concurrency:
  group: betbot-daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Send report
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Manual "Run workflow" dispatches bypass the time window so a manual trigger
          # actually sends a report regardless of time of day; scheduled ticks still respect it.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python scripts/report.py
