name: Scan for +EV bets

on:
  schedule:
    # Ticks every 10 minutes so Telegram command handling (/placed, /skip, /settle, etc.)
    # stays responsive; betbot.main only actually calls the Odds API when the real Eastern
    # clock time (DST-aware) falls within a scan window -- see config/settings.yaml
    # `scheduling.scan_times_local` (currently 8x/day, evenly every 3 hours). NOTE: this repo
    # is private, so these ~144 runs/day do count against GitHub Actions' included minutes
    # (2,000-3,000/month depending on plan) -- each run is short, but at ~1 billed minute
    # each that's still ~4,300 min/month from this workflow alone. Worth checking your
    # Actions usage (repo Settings -> Billing, or account billing settings) if you're near
    # the free tier, since exceeding it either costs money or GitHub Actions pauses.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: betbot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Manual "Run workflow" dispatches bypass the scan-time window so a manual trigger
          # actually does something regardless of time of day; scheduled ticks still respect it.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python -m betbot.main
