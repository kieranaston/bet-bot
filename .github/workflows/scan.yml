name: Scan for +EV bets

on:
  schedule:
    # Ticks every 10 minutes, but this costs nothing by itself (GitHub Actions minutes are
    # free/cheap for a personal repo, not Odds API credits). betbot.main only actually calls
    # the Odds API when the real Eastern clock time (DST-aware) falls within a scan window
    # -- see config/settings.yaml `scheduling.scan_times_local` (currently 11am/5pm/11pm ET).
    # Telegram command handling (/placed, /skip, /settle, etc.) still runs every tick.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: betbot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m betbot.main
