name: Scan for +EV bets

on:
  schedule:
    # GitHub's schedule trigger is best-effort and heavily throttles `*/10` (this repo was
    # getting ~3 runs/day instead of 144, so Telegram commands sat unanswered for hours).
    # Twice-hourly at off-peak minutes is delivered much more reliably, stays inside a
    # typical private-repo Actions allowance (~1,440 billed min/month), and :08 UTC still
    # lands inside each Eastern :00 scan window (see config/settings.yaml
    # `scheduling.scan_times_local` / `scan_window_minutes`). betbot.main only calls the
    # Odds API when local Eastern time is in one of those windows.
    # NOTE: if schedules stop firing after a cron edit, nudge these minutes (and/or
    # disable+re-enable the workflow) -- GitHub's scheduler can stick on a stale registration.
    - cron: "8 * * * *"
    - cron: "38 * * * *"
  workflow_dispatch: {}

concurrency:
  group: betbot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Manual "Run workflow" dispatches bypass the scan-time window so a manual trigger
          # actually does something regardless of time of day; scheduled ticks still respect it.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python -m betbot.main
