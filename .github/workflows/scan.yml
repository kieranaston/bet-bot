name: Scan for +EV bets

on:
  schedule:
    # Every 15 minutes. This is the base polling rate -- betbot.scheduler applies its own
    # adaptive cooldown on top so you don't get re-alerted every 15 min for an unchanged line;
    # see config/settings.yaml `scheduling.tiers`.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: betbot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m betbot.main
