name: Scan for +EV bets

on:
  # GitHub's schedule trigger was confirmed unreliable at higher frequencies on 2026-09-12:
  # dropped ~98% of ticks at */10 and 100% of ticks at twice-hourly, surviving a workflow
  # rename/recreate and an API disable/re-enable. Dropping to a low, infrequent cadence
  # instead of chasing an external trigger -- accepting laggier Telegram command replies
  # (up to ~3h between ticks) in exchange for actually running reliably. If runs stop
  # showing up again, don't just re-tune the cron -- confirm via `gh run list
  # --workflow=betbot-scan.yml` before assuming a config change fixed anything.
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass scan-time gating and force a real scan"
        type: boolean
        default: false

concurrency:
  group: betbot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
        run: python -m betbot.main
