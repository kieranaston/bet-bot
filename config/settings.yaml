# Core bot settings. Secrets (API keys, tokens, DB URL) live in .env / GitHub Actions secrets,
# never here.

bankroll:
  # Starting bankroll in your unit currency (CAD). The bot's "current" bankroll is tracked in
  # the database and updated via the /bankroll Telegram command or automatically from settled
  # bets. This value is only used the very first time the database is initialized.
  starting_amount: 1000.0
  kelly_fraction: 0.25          # quarter Kelly
  max_stake_pct_of_bankroll: 0.05   # hard safety cap per bet, regardless of Kelly output
  min_stake: 1.0                # don't bother alerting a stake below this

ev:
  min_ev_pct: 2.0               # only alert when EV >= this percent
  # Floor on the devigged true (fair) win probability -- EV% alone doesn't capture
  # variance, and devig error is proportionally larger at the tails (a given probability
  # miscalibration matters much more at 8% than at 40%), so extreme-longshot "+EV" bets are
  # both higher-variance and less trustworthy than they look. 0.25 excludes anything with
  # fair odds longer than about +300 American; doesn't affect favorites, only longshots.
  min_true_prob: 0.25
  # Devig method for turning sharp two-way odds into "true" probabilities.
  # "multiplicative" (basic proportional devig) is the only one implemented in v1.
  devig_method: multiplicative

sports:
  # The Odds API sport keys. Main markets only for v1 (moneyline / spread / totals).
  - key: americanfootball_nfl
    markets: [h2h, spreads, totals]
  - key: basketball_nba
    markets: [h2h, spreads, totals]
  - key: icehockey_nhl
    markets: [h2h, spreads, totals]
  - key: baseball_mlb
    markets: [h2h, spreads, totals]
  # Added to use more of a 20,000/month Odds API quota (previous 4 sports cost ~1,080/month)
  # while staying on markets/leagues where Pinnacle is still a liquid, sharp reference --
  # deliberately not extended to player props or thin/niche leagues (see chat -- Pinnacle's
  # line quality degrades there, which would raise false-positive +EV alerts, not real ones).
  #
  # Market selection per sport follows the docs' own reliability caveat: "spreads and totals
  # markets are mainly available for US sports and bookmakers at this time" (api-docs/
  # docs_markdown/liveapi_guides_v4.md). Unlike the per-event odds endpoint, the plain /odds
  # endpoint used for real scans charges for every REQUESTED market regardless of whether any
  # bookmaker actually returns data for it -- so requesting a market Pinnacle doesn't reliably
  # price there isn't just a missed signal, it's wasted spend every scan. NCAAF/NCAAB are
  # unambiguously "US sports" per that caveat, so they keep the full h2h/spreads/totals set.
  - key: americanfootball_ncaaf
    markets: [h2h, spreads, totals]
  # basketball_ncaab: removed 2026-09-12 -- live-verified via scripts/list_bookmakers.py-style
  # check, 0 upcoming events in the 7-day scan window (season starts ~November). Re-add and
  # re-verify Pinnacle coverage once the season starts.
  - key: mma_mixed_martial_arts
    markets: [h2h]
  # CFL is American-football-shaped (same market structure as NFL) but is a Canadian league,
  # not clearly a "US sport" per the caveat above -- restricted to h2h until spreads/totals
  # coverage is verified live (see scripts/list_bookmakers.py --market spreads/totals).
  - key: americanfootball_cfl
    markets: [h2h]
  # Soccer h2h is 3-way (home/draw/away) -- devig/EV/matching in betbot.ev and betbot.main
  # already generalize to N-way markets, and betbot.settlement.grade_alert handles a tied
  # score on a home/away bet as a loss (the Draw outcome won), not a push. Restricted to h2h
  # only: Pinnacle's soccer reputation is specifically about h2h/Asian-handicap/totals on
  # their own site, which doesn't guarantee this aggregator's spreads/totals normalization is
  # reliable for non-US sports per the caveat above -- verify before re-adding those markets.
  - key: soccer_epl
    markets: [h2h]
  # soccer_uefa_champs_league: removed 2026-09-12 -- 0 upcoming events in the 7-day scan
  # window when live-checked. Unlike NCAAB this could just be a between-matchdays gap rather
  # than true off-season -- worth re-checking within a few days rather than waiting months.
  - key: soccer_spain_la_liga
    markets: [h2h]
  - key: soccer_germany_bundesliga
    markets: [h2h]
  - key: soccer_italy_serie_a
    markets: [h2h]
  - key: soccer_usa_mls
    markets: [h2h]

odds_api:
  # Confirmed cost formula (The Odds API docs, api-docs/docs_markdown/ crawled 2026-09-11):
  # cost = [markets] x [region-equivalents]. The `bookmakers=` param is confirmed cheaper
  # for us: "every group of 10 bookmakers is the equivalent of 1 region" (docs, verbatim).
  # Our 7 books (Pinnacle + 6 Ontario) are <=10, so `bookmakers=` costs 1 region-equivalent
  # instead of the 2 regions `regions=eu,ca` would cost for the same data -- real scans use
  # `bookmakers=` (built from config/bookmakers.yaml). `regions` below is kept only for
  # scripts/list_bookmakers.py's broad discovery use.
  regions: "eu,ca"
  odds_format: decimal
  base_url: "https://api.the-odds-api.com/v4"

scheduling:
  # We spend Odds API credits every 30 min, 10am-11:30pm Eastern (your stated
  # waking/actionable hours) -- checked in real Eastern clock time (DST-aware via
  # zoneinfo). `scan_window_minutes` is set to exactly match this 30-min slot spacing: at
  # the boundary between two slots (e.g. exactly 10:30:00), the elapsed-minutes check for
  # the earlier slot is `30 < 30` (False, correctly excluded) while the later slot's check
  # is `0 <= 0 < 30` (True) -- so adjacent windows abut with zero gap and zero overlap.
  #
  # Deliberately NOT round-the-clock: earlier reasoning favored even spacing so Pinnacle's
  # overnight-ET soccer activity (European business hours) wouldn't be missed, but an alert
  # at 3am ET is useless if you're asleep and can't act on it before the price moves --
  # your ability to actually place the bet matters more than catching every window a sharp
  # line happens to be most active. Overnight soccer mispricings are simply not caught by
  # this schedule; that's an accepted, deliberate tradeoff, not an oversight.
  #
  # 28 scans/day deliberately targets a high fraction of the monthly budget (per your
  # request), not just "more scans than before": at ~22 credits/scan worst-case (12
  # sports' markets x 1 region-equivalent, every sport with a live game), that's
  # ~18,480 credits/month -- ~92% of a 20,000/month plan. Realistic days come in lower
  # (NBA/NHL etc. often have no upcoming game and skip their paid call for free -- actual
  # logged scans have cost as little as 16 credits), giving a natural safety margin
  # against ever exceeding the plan without needing to budget for it explicitly.
  timezone: "America/Toronto"
  scan_times_local: ["10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00", "21:30", "22:00", "22:30", "23:00", "23:30"]
  scan_window_minutes: 30

  # Adaptive re-alert cooldown tiers, keyed by hours-to-commence -> minimum minutes between
  # re-alerting the *same* (event, market, bookmaker, outcome) unless the price moves. These
  # are real-elapsed-time throttles, independent of the scan gap above -- with the current
  # 1-hour gap, the <=1h tier (60 min cooldown) still re-alerts almost every scan as
  # intended (more frequent reminders as the decision deadline approaches), while the
  # <=6h/<=24h/>24h tiers now skip roughly 3x/6x/12x as many scans between re-alerts as they
  # did at the old 3-hour gap -- not re-tuned for that yet, since fewer/gentler reminders on
  # a lower-urgency bet isn't obviously wrong, just untested against the new cadence.
  tiers:
    - max_hours_to_commence: 1
      cooldown_minutes: 60
    - max_hours_to_commence: 6
      cooldown_minutes: 180
    - max_hours_to_commence: 24
      cooldown_minutes: 360
    - max_hours_to_commence: 999999
      cooldown_minutes: 720
  # Don't bother processing events further out than this -- lines aren't liquid/final yet
  # and re-checking them wastes API credits.
  max_hours_ahead: 168   # 7 days

reporting:
  # Daily digest send time, checked the same DST-aware way as scheduling.scan_times_local
  # (see betbot.scheduler.is_scan_time) so it doesn't drift an hour across DST changes the
  # way a fixed UTC cron would. .github/workflows/daily_report.yml ticks every 10 minutes
  # for free and only actually sends when local Eastern time falls in this window.
  time_local: "09:00"

settlement:
  # Auto-settle placed bets using The Odds API's /scores endpoint (flat 2 credits/request
  # with days_from set) instead of requiring a manual /settle for every bet. Runs inside
  # the same 8x/day scan window, and only for sports with at least one placed-but-unsettled
  # bet -- so it costs nothing on days with nothing to settle.
  enabled: true
  # How many past days of completed games to look back over (max 3, per Odds API limit).
  days_from: 2
