# Core bot settings. Secrets (API keys, tokens, DB URL) live in .env / GitHub Actions secrets,
# never here.

bankroll:
  # Starting bankroll in your unit currency (CAD). The bot's "current" bankroll is tracked in
  # the database and updated via the /bankroll Telegram command or automatically from settled
  # bets. This value is only used the very first time the database is initialized.
  starting_amount: 1000.0
  kelly_fraction: 0.25          # quarter Kelly
  max_stake_pct_of_bankroll: 0.05   # hard safety cap per bet, regardless of Kelly output
  min_stake: 1.0                # don't bother alerting a stake below this

ev:
  min_ev_pct: 2.0               # only alert when EV >= this percent
  # Devig method for turning sharp two-way odds into "true" probabilities.
  # "multiplicative" (basic proportional devig) is the only one implemented in v1.
  devig_method: multiplicative

sports:
  # The Odds API sport keys. Main markets only for v1 (moneyline / spread / totals).
  - key: americanfootball_nfl
    markets: [h2h, spreads, totals]
  - key: basketball_nba
    markets: [h2h, spreads, totals]
  - key: icehockey_nhl
    markets: [h2h, spreads, totals]
  - key: baseball_mlb
    markets: [h2h, spreads, totals]

odds_api:
  # Confirmed cost formula (The Odds API docs, api-docs/docs_markdown/ crawled 2026-09-11):
  # cost = [markets] x [region-equivalents]. The `bookmakers=` param is confirmed cheaper
  # for us: "every group of 10 bookmakers is the equivalent of 1 region" (docs, verbatim).
  # Our 7 books (Pinnacle + 6 Ontario) are <=10, so `bookmakers=` costs 1 region-equivalent
  # instead of the 2 regions `regions=eu,ca` would cost for the same data -- real scans use
  # `bookmakers=` (built from config/bookmakers.yaml). `regions` below is kept only for
  # scripts/list_bookmakers.py's broad discovery use.
  regions: "eu,ca"
  odds_format: decimal
  base_url: "https://api.the-odds-api.com/v4"

scheduling:
  # We only spend Odds API credits 3x/day, at these local times. Checked in real Eastern
  # clock time (DST-aware via zoneinfo) -- .github/workflows/scan.yml's cron ticks every
  # 10 minutes for free, but betbot.main only actually calls the Odds API when "now" falls
  # within `scan_window_minutes` of one of these times. No manual DST edits needed.
  timezone: "America/Toronto"
  scan_times_local: ["11:00", "17:00", "23:00"]
  scan_window_minutes: 10

  # Adaptive re-alert cooldown tiers, keyed by hours-to-commence -> minimum minutes between
  # re-alerting the *same* (event, market, bookmaker, outcome) unless the price moves.
  # Since real scans only happen ~every 6 hours (see scan_times_local above), these are
  # tuned so a still-open, unchanged opportunity doesn't get re-pinged on every single scan.
  tiers:
    - max_hours_to_commence: 1
      cooldown_minutes: 60
    - max_hours_to_commence: 6
      cooldown_minutes: 180
    - max_hours_to_commence: 24
      cooldown_minutes: 360
    - max_hours_to_commence: 999999
      cooldown_minutes: 720
  # Don't bother processing events further out than this -- lines aren't liquid/final yet
  # and re-checking them wastes API credits.
  max_hours_ahead: 168   # 7 days

settlement:
  # Auto-settle placed bets using The Odds API's /scores endpoint (flat 2 credits/request
  # with days_from set) instead of requiring a manual /settle for every bet. Runs inside
  # the same 3x/day scan window, and only for sports with at least one placed-but-unsettled
  # bet -- so it costs nothing on days with nothing to settle.
  enabled: true
  # How many past days of completed games to look back over (max 3, per Odds API limit).
  days_from: 2
