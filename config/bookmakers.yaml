# Bookmaker key configuration for The Odds API (https://the-odds-api.com/).
#
# This is a deliberately closed allowlist, confirmed by the user -- only these exact books
# are checked. No suffix-based auto-matching: if a book isn't listed here, it's ignored,
# even if The Odds API returns it under the `ca` region.

sharp:
  # Pinnacle is the reference "true odds" book. Region: eu.
  known_keys:
    - pinnacle
  display_names:
    pinnacle: Pinnacle

ontario:
  # Region: ca. Confirmed exact list -- do not add books here without explicit sign-off.
  known_keys:
    - bet99_ca_on
    - betano_ca_on
    - betmgm_ca_on
    - betrivers_ca_on
    - proline_ca_on
    - sportsinteraction_ca_on
  # Left empty on purpose: no automatic suffix matching. Everything must be in known_keys
  # above.
  auto_match_suffixes: []
  # Human-readable names shown in Telegram alerts, instead of the raw API key.
  display_names:
    bet99_ca_on: Bet99
    betano_ca_on: Betano
    betmgm_ca_on: BetMGM
    betrivers_ca_on: BetRivers
    proline_ca_on: PROLINE+
    sportsinteraction_ca_on: Sports Interaction
