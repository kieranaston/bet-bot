# Bookmaker key configuration for The Odds API (https://the-odds-api.com/).
#
# This is a deliberately closed allowlist, confirmed by the user -- only these exact books
# are checked. No suffix-based auto-matching: if a book isn't listed here, it's ignored,
# even if The Odds API returns it under the `ca` region.

sharp:
  # Pinnacle is the reference "true odds" book. Region: eu.
  known_keys:
    - pinnacle
  display_names:
    pinnacle: Pinnacle

consensus:
  # Player props have no Pinnacle line to devig against (Pinnacle doesn't reliably post US
  # player props -- see the comment above `sports:` in config/settings.yaml), so for props
  # only, the "sharp" reference is a multi-book average of these high-volume US books'
  # no-vig implied probabilities instead of a single sharp book. None of these keys overlap
  # ontario.known_keys below (betmgm here is the US key, distinct from betmgm_ca_on) --
  # confirmed no self-comparison risk. Live-verify via scripts/list_event_markets.py before
  # trusting these keys, same as every other bookmaker list in this file.
  known_keys:
    - fanduel
    - draftkings
    - betmgm
  # Require at least this many of the books above to have posted a line before treating the
  # average as trustworthy -- a single book's price is not a consensus.
  min_books_required: 2
  display_names:
    fanduel: FanDuel
    draftkings: DraftKings
    betmgm: BetMGM

ontario:
  # Region: ca. Confirmed exact list -- do not add books here without explicit sign-off.
  known_keys:
    - bet99_ca_on
    - betano_ca_on
    - betmgm_ca_on
    - betrivers_ca_on
    - proline_ca_on
    - sportsinteraction_ca_on
  # Left empty on purpose: no automatic suffix matching. Everything must be in known_keys
  # above.
  auto_match_suffixes: []
  # Human-readable names shown in Telegram alerts, instead of the raw API key.
  display_names:
    bet99_ca_on: Bet99
    betano_ca_on: Betano
    betmgm_ca_on: BetMGM
    betrivers_ca_on: BetRivers
    proline_ca_on: PROLINE+
    sportsinteraction_ca_on: Sports Interaction
  # Final fallback link when The Odds API's includeLinks doesn't return an outcome/market/
  # bookmaker link for this book (per their docs: fall back to the bookmaker's homepage,
  # since the API doesn't provide one). Best-effort guesses -- NOT verified against each
  # book's actual current domain, please double check these before relying on them.
  homepage_urls:
    bet99_ca_on: "https://bet99.com/"
    betano_ca_on: "https://www.betano.ca/"
    betmgm_ca_on: "https://ontario.betmgm.ca/"
    betrivers_ca_on: "https://on.betrivers.com/"
    proline_ca_on: "https://www.proline.ca/"
    sportsinteraction_ca_on: "https://www.sportsinteraction.com/"
